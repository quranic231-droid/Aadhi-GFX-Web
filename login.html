<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AADHI AADIL PREMIUM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030305;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ================= AMBIENT GLOW BACKGROUND ================= */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        .blob-1 { width: 350px; height: 350px; background: rgba(109, 40, 217, 0.4); top: -10%; left: -10%; }
        .blob-2 { width: 300px; height: 300px; background: rgba(0, 255, 200, 0.25); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 250px; height: 250px; background: rgba(255, 107, 154, 0.2); top: 40%; left: 40%; animation-delay: -2s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.2); }
        }

        /* ================= PREMIUM LOADER ================= */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #030305;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, backdrop-filter 0.8s;
        }
        .luxury-loader {
            width: 80px; height: 80px;
            position: relative;
        }
        .ring {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00FFC8;
            border-right-color: #00FFC8;
            animation: spinRing 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .ring::before {
            content: ''; position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #A78BFA;
            border-left-color: #A78BFA;
            animation: spinRing 2s linear infinite reverse;
        }
        .ring::after {
            content: ''; position: absolute;
            top: 25px; left: 25px; right: 25px; bottom: 25px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-bottom-color: #FF6B9A;
            animation: spinRing 1s linear infinite;
        }

        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .brand-3d-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-top: 30px;
            background: linear-gradient(to right, #ffffff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(255,255,255,0.2);
            animation: pulseGlow 2s infinite;
        }
        
        .loading-text {
            color: #00FFC8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-top: 15px;
            text-transform: uppercase;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
            50% { filter: drop-shadow(0 0 25px rgba(255,255,255,0.5)); }
        }

        /* ================= GLASSMORPHISM LOGIN CARD ================= */
        .login-card {
            background: rgba(15, 17, 26, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 40px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.02);
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .login-card.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .brand .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900; letter-spacing: 2px;
            color: #FFFFFF;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        
        .brand .sub {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #00FFC8;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, transparent, rgba(0,255,200,0.15), transparent);
            padding: 4px 0;
            margin-bottom: 25px;
        }

        /* Premium Inputs */
        .input-group { margin-bottom: 22px; }
        .input-group .input-label { 
            display: block; font-size: 11px; font-weight: 700; color: #94A3B8; 
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; margin-left: 4px;
        }
        .input-group .input-wrapper { 
            border-radius: 14px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; align-items: center; padding: 0 16px; 
            transition: all 0.3s ease; 
        }
        .input-group .input-wrapper:focus-within { 
            border-color: #00FFC8; 
            box-shadow: 0 0 20px rgba(0,255,200,0.15); 
            background: rgba(0, 0, 0, 0.6);
        }
        .input-group .input-wrapper input { 
            width: 100%; padding: 18px 0; background: transparent; border: none; 
            color: #FFFFFF; font-size: 16px; outline: none; font-weight: 600; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
        }
        .input-group .input-wrapper input::placeholder { color: #475569; font-weight: 500; }

        .eye-btn {
            background: transparent; border: none; color: #64748B; font-size: 18px; cursor: pointer; padding: 0 5px; outline: none; transition: 0.3s;
        }
        .eye-btn:hover { color: #00FFC8; }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #EF4444 !important; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Premium Buttons */
        .btn { 
            width: 100%; padding: 16px 0; border: none; border-radius: 12px; 
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; 
            font-family: 'Rajdhani', sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-login { 
            background: linear-gradient(90deg, #00FFC8, #0088FF); 
            color: #030305; 
            box-shadow: 0 10px 25px rgba(0,255,200,0.3); 
            border: none;
            font-weight: 900;
        }
        .btn-login:hover { box-shadow: 0 15px 35px rgba(0,255,200,0.4); filter: brightness(1.1); }
        
        .btn-login .spinner { display: none; width: 22px; height: 22px; border: 2px solid rgba(0,0,0,0.2); border-top: 2px solid #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }
        
        .btn-free { background: rgba(255,255,255,0.03); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.1); }
        .btn-free:hover { background: rgba(255,255,255,0.08); }

        .btn-getkey { background: transparent; color: #A78BFA; border: 1px dashed rgba(167,139,250,0.4); margin-top: 10px; }
        .btn-telegram { background: rgba(0, 136, 255, 0.1); color: #0088FF; border: 1px solid rgba(0,136,255,0.3); margin-bottom: 0; }

        .footer { text-align: center; margin-top: 25px; font-size: 11px; color: #475569; letter-spacing: 1px; font-weight: 600; }
        .footer .highlight { color: #00FFC8; }

        .toast-msg {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 12px 28px; color: #FFFFFF; font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.4s ease;
            pointer-events: none; z-index: 999;
            letter-spacing: 1px;
        }
        .toast-msg.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <!-- AMBIENT BACKGROUND BLOBS -->
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>

    <!-- 3D LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="luxury-loader"><div class="ring"></div></div>
        <div class="brand-3d-text">AADHI AADIL</div>
        <div class="loading-text">Initializing Secure Engine</div>
    </div>

    <!-- GLASS LOGIN CARD -->
    <div class="login-card" id="loginCard">
        <div class="brand">
            <div class="main-title">AADHI AADIL</div>
            <div class="sub">VIP GFX ENGINE</div>
        </div>

        <div class="input-group" id="inputGroup">
            <span class="input-label">Security Key</span>
            <div class="input-wrapper" id="inputWrapper">
                <input type="password" id="editKey" placeholder="Paste your key here..." autocomplete="off">
                <button class="eye-btn" onclick="togglePassword()" id="eyeBtn">👁️</button>
            </div>
        </div>

        <button class="btn btn-login" id="btnLogin" onclick="handleLogin()">
            <span class="btn-text">AUTHENTICATE</span>
            <span class="spinner"></span>
        </button>

        <button class="btn btn-free" onclick="freeLogin()">GUEST ACCESS</button>

        <button class="btn btn-getkey" onclick="openTelegram('https://t.me/aadhi_aadil0')">PURCHASE VIP KEY</button>
        <button class="btn btn-telegram" onclick="openTelegram('https://t.me/+7d23o7Tw1Zo5NmM1')">JOIN TELEGRAM</button>

        <div class="footer">
            SYS_VER: <span id="appVersion">3.0</span> &nbsp;|&nbsp; <span class="highlight">SECURE CONNECTION</span>
        </div>
    </div>

    <div id="toast" class="toast-msg">Ready</div>

    <!-- JAVASCRIPT (Unchanged for Android Bridging) -->
    <script>
        var toastTimeout;

        function showToast(msg, isError) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.style.color = isError ? '#EF4444' : '#00FFC8';
            t.style.borderColor = isError ? 'rgba(239,68,68,0.3)' : 'rgba(0,255,200,0.3)';
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() { t.classList.remove('show'); }, 3000);
        }

        function togglePassword() {
            var keyInput = document.getElementById('editKey');
            var eyeBtn = document.getElementById('eyeBtn');
            if (keyInput.type === "password") {
                keyInput.type = "text";
                eyeBtn.innerHTML = "🙈"; 
            } else {
                keyInput.type = "password";
                eyeBtn.innerHTML = "👁️"; 
            }
        }

        function openTelegram(url) {
            if (window.Android && Android.openTelegram) {
                Android.openTelegram(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function triggerError(msg) {
            showToast(msg, true);
            var inputWrapper = document.getElementById('inputWrapper');
            inputWrapper.classList.add('shake');
            setTimeout(function() {
                inputWrapper.classList.remove('shake');
            }, 400);
            document.getElementById('editKey').focus();
        }

        function handleLogin() {
            var key = document.getElementById('editKey').value.trim();
            if (!key) {
                triggerError('ACCESS DENIED: Key is required');
                return;
            }
            var btn = document.getElementById('btnLogin');
            btn.classList.add('loading');
            btn.disabled = true;

            if (window.Android && Android.goToDashboard) {
                Android.goToDashboard(key);
            } else {
                showToast('SYSTEM ERROR: Bridge disconnected', true);
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function freeLogin() {
            var btn = document.getElementById('btnLogin');
            btn.classList.add('loading');
            btn.disabled = true;
            
            if (window.Android && Android.goToDashboard) {
                Android.goToDashboard("FREE_ACCESS");
            } else {
                showToast('SYSTEM ERROR: Bridge disconnected', true);
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function attemptAutoLogin() {
            try {
                if (window.Android && Android.getSavedKey) {
                    var savedKey = Android.getSavedKey();
                    if (savedKey && savedKey.length > 0) {
                        document.getElementById('editKey').value = savedKey;
                        setTimeout(function() { handleLogin(); }, 500);
                    }
                }
            } catch(e) {}
        }

        function loadVersion() {
            try {
                if (window.Android && Android.getAppVersion) {
                    var ver = Android.getAppVersion();
                    document.getElementById('appVersion').textContent = ver;
                }
            } catch(e) {}
        }

        window.onload = function() {
            setTimeout(function() {
                var overlay = document.getElementById('loadingOverlay');
                var loginCard = document.getElementById('loginCard');
                
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                
                loginCard.classList.add('visible');
                
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 800);
                
                loadVersion();
                attemptAutoLogin();
                
                setTimeout(function() {
                    document.getElementById('editKey').focus();
                }, 1000);
            }, 2500);
        };
        
        document.getElementById('editKey').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });
    </script>
</body>
</html>
