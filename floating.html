<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aadhi GFX Floating</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        /* 🔥 BODY TRANSPARENT RAKHNA ZAROORI HAI 🔥 */
        body {
            background: transparent !important;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            user-select: none; -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        /* 🔥 PREMIUM TRANSPARENT GLASS WINDOW 🔥 */
        .floating-window {
            width: 330px; max-width: 92vw;
            background: rgba(10, 14, 23, 0.70); /* 70% dark, 30% transparent */
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); /* Piche ka game blur dikhega */
            border-radius: 24px;
            padding: 16px 20px 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-top: 1px solid rgba(0, 255, 204, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(0, 255, 204, 0.05);
            position: relative;
        }

        /* DRAG HANDLE (Java isko pakad kar drag karega) */
        .drag-handle {
            position: absolute; top: 0; left: 0; right: 0; height: 45px;
            cursor: grab; border-radius: 24px 24px 0 0; z-index: 10;
        }
        .drag-bar {
            width: 40px; height: 4px; background: rgba(255, 255, 255, 0.3);
            border-radius: 10px; margin: 8px auto 0;
        }

        /* HEADER */
        .header {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding-top: 10px; padding-bottom: 12px; position: relative; z-index: 5;
        }
        .header .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #00ffcc; box-shadow: 0 0 12px #00ffcc;
            animation: pulse-dot 2s infinite; transition: 0.3s;
        }
        .header .status-dot.off { background: #ff3366; box-shadow: 0 0 10px rgba(255,51,102,0.6); animation: none; }
        
        .header .brand { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        
        /* 🔥 NAME CHANGED TO AADHI GFX TOOL 🔥 */
        .header .brand .title {
            font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px;
            color: #fff; text-shadow: 0 0 10px rgba(0,255,204,0.4);
        }
        .header .brand .title span { color: #00ffcc; }
        .header .brand .sub { font-size: 10px; color: #94a3b8; letter-spacing: 3px; font-weight: 700; margin-top: 4px; }
        
        .divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,204,0.3), transparent); margin-bottom: 15px; }

        /* PAK STATUS BOX */
        .pak-status {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px; transition: 0.3s;
        }
        .pak-status.active { border-color: rgba(0,255,204,0.4); box-shadow: inset 0 0 15px rgba(0,255,204,0.05); }
        .pak-status .info { display: flex; align-items: center; gap: 10px; }
        .pak-status .info .icon { font-size: 16px; filter: grayscale(100%); opacity: 0.5; transition: 0.3s; }
        .pak-status.active .info .icon { filter: grayscale(0%); opacity: 1; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .pak-status .info .text { font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 1px; text-transform: uppercase; }
        .pak-status.active .info .text { color: #00ffcc; }
        .pak-status .badge { font-size: 10px; font-weight: 800; color: #64748b; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 8px; }
        .pak-status.active .badge { color: #000; background: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }

        /* ACTION BUTTONS */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-apply {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.4));
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
            padding: 12px 5px; text-align: center; cursor: pointer; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .btn-apply .em { font-size: 18px; }
        .btn-apply .txt { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-apply:not(.disabled):hover { background: rgba(0,255,204,0.1); border-color: rgba(0,255,204,0.4); }
        .btn-apply:not(.disabled):active { transform: scale(0.95); }
        .btn-apply.applying { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.3); animation: pulseGlow 1s infinite; }
        .btn-apply.applying .txt { color: #00ffcc; }
        .btn-apply.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }

        @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 10px rgba(0,255,204,0.2); } 50% { box-shadow: 0 0 25px rgba(0,255,204,0.6); } }
        @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.6; } }

        /* DNS TOGGLE SWITCH */
        .dns-card {
            background: rgba(0,0,0,0.4); border-radius: 16px; padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px; transition: 0.3s;
        }
        .dns-card.active { border-color: rgba(0,119,255,0.4); box-shadow: inset 0 0 15px rgba(0,119,255,0.1); }
        
        .dns-info { display: flex; flex-direction: column; gap: 2px; }
        .dns-info .title { font-size: 13px; font-weight: 700; color: #e2e8f0; letter-spacing: 1px; }
        .dns-info .sub { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .dns-card.active .dns-info .sub { color: #0077ff; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: 0.4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #94a3b8; transition: 0.4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0,119,255,0.2); border-color: #0077ff; box-shadow: 0 0 15px rgba(0,119,255,0.4); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; box-shadow: 0 0 10px #fff; }

        /* BOTTOM CONTROLS */
        .bottom-controls { display: flex; gap: 10px; }
        .btn-bottom {
            flex: 1; padding: 12px 0; border-radius: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
            text-align: center; cursor: pointer; transition: 0.2s; border: none; color: #fff;
        }
        .btn-bottom:active { transform: scale(0.95); }
        .btn-hide { background: linear-gradient(90deg, rgba(51,65,85,0.8), rgba(30,41,59,0.8)); box-shadow: 0 5px 15px rgba(0,0,0,0.3); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); }
        .btn-close { background: linear-gradient(90deg, rgba(255,0,85,0.8), rgba(204,0,68,0.8)); box-shadow: 0 5px 15px rgba(255,0,85,0.3); border: 1px solid rgba(255,0,85,0.4); }

        /* TOAST NOTIFICATION */
        .float-toast {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: rgba(0,0,0,0.9); border: 1px solid #00ffcc; border-radius: 12px;
            padding: 8px 18px; font-size: 11px; font-weight: 700; color: #00ffcc; letter-spacing: 1px;
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100;
            box-shadow: 0 5px 15px rgba(0,255,204,0.2); text-transform: uppercase;
        }
        .float-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="floating-window" id="floatingWindow">
        <!-- DRAG HANDLE -->
        <div class="drag-handle" id="dragHandle">
            <div class="drag-bar"></div>
        </div>

        <!-- HEADER -->
        <div class="header">
            <span class="status-dot" id="headerDot"></span>
            <div class="brand">
                <span class="title">AADHI <span>GFX TOOL</span></span>
                <span class="sub">PREMIUM FLOATING ENGINE</span>
            </div>
        </div>
        <div class="divider"></div>

        <!-- PAK STATUS -->
        <div class="pak-status" id="pakStatus">
            <div class="info">
                <span class="icon">🚀</span>
                <span class="text" id="pakStatusText">NO PAK SELECTED</span>
            </div>
            <span class="badge" id="pakBadge">NONE</span>
        </div>

        <!-- APPLY BUTTONS -->
        <div class="action-grid">
            <div class="btn-apply disabled" id="btnLobby">
                <span class="em">🎮</span>
                <span class="txt">LOBBY APPLY</span>
            </div>
            <div class="btn-apply disabled" id="btnInGame">
                <span class="em">⚔️</span>
                <span class="txt">IN-GAME APPLY</span>
            </div>
        </div>

        <!-- DNS TOGGLE -->
        <div class="dns-card" id="dnsCard">
            <div class="dns-info">
                <span class="title">ANTI-BAN DNS</span>
                <span class="sub" id="dnsSubtitle">Protection Disabled</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="dnsToggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="bottom-controls">
            <div class="btn-bottom btn-hide" id="btnHide">HIDE</div>
            <div class="btn-bottom btn-close" id="btnClose">CLOSE</div>
        </div>

        <!-- TOAST -->
        <div class="float-toast" id="floatToast">READY</div>
    </div>

    <script>
        var headerDot = document.getElementById('headerDot');
        var dnsCard = document.getElementById('dnsCard');
        var dnsSubtitle = document.getElementById('dnsSubtitle');
        var dnsToggle = document.getElementById('dnsToggle');
        var pakStatus = document.getElementById('pakStatus');
        var pakStatusText = document.getElementById('pakStatusText');
        var pakBadge = document.getElementById('pakBadge');
        var btnLobby = document.getElementById('btnLobby');
        var btnInGame = document.getElementById('btnInGame');
        var btnHide = document.getElementById('btnHide');
        var btnClose = document.getElementById('btnClose');
        var floatToast = document.getElementById('floatToast');

        var isProtected = false;
        var currentPak = null;

        function showFloatToast(msg, isError) {
            floatToast.textContent = msg;
            floatToast.style.color = isError ? '#ff3366' : '#00ffcc';
            floatToast.style.borderColor = isError ? 'rgba(255,51,102,0.5)' : 'rgba(0,255,204,0.5)';
            floatToast.classList.add('show');
            clearTimeout(floatToast._t);
            floatToast._t = setTimeout(function() {
                floatToast.classList.remove('show');
            }, 2500);
        }

        window.setProtectionState = function(active) {
            isProtected = active;
            dnsToggle.checked = active; 
            if (active) {
                headerDot.className = 'status-dot';
                dnsCard.classList.add('active');
                dnsSubtitle.textContent = 'SECURE DNS RUNNING';
            } else {
                headerDot.className = 'status-dot off';
                dnsCard.classList.remove('active');
                dnsSubtitle.textContent = 'PROTECTION DISABLED';
            }
        };

        window.setPakState = function(pakKey) {
            if (!pakKey || pakKey === "null" || pakKey === "") {
                currentPak = null;
                pakStatus.classList.remove('active');
                pakStatusText.textContent = 'NO PAK SELECTED';
                pakBadge.textContent = 'NONE';
                btnLobby.classList.add('disabled');
                btnInGame.classList.add('disabled');
            } else {
                currentPak = pakKey;
                var pakName = pakKey.toUpperCase().replace('_URL', '');
                pakStatus.classList.add('active');
                pakStatusText.textContent = pakName + ' READY';
                pakBadge.textContent = 'ACTIVE';
                btnLobby.classList.remove('disabled');
                btnInGame.classList.remove('disabled');
            }
        };

        dnsToggle.addEventListener('change', function(e) {
            var targetState = e.target.checked;
            if (window.Android && window.Android.onProtectionToggle) {
                window.Android.onProtectionToggle(targetState);
            }
            setProtectionState(targetState);
        });

        btnLobby.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!currentPak || btnLobby.classList.contains('disabled')) return;
            if (window.Android && Android.reapplyPak) {
                Android.reapplyPak("lobby");
                btnLobby.classList.add('applying');
                showFloatToast('APPLYING LOBBY...', false);
                setTimeout(function() {
                    btnLobby.classList.remove('applying');
                    showFloatToast('LOBBY APPLIED ✓', false);
                }, 2500);
            } else {
                showFloatToast('SYSTEM ERROR', true);
            }
        });

        btnInGame.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!currentPak || btnInGame.classList.contains('disabled')) return;
            if (window.Android && Android.reapplyPak) {
                Android.reapplyPak("ingame");
                btnInGame.classList.add('applying');
                showFloatToast('APPLYING IN-GAME...', false);
                setTimeout(function() {
                    btnInGame.classList.remove('applying');
                    showFloatToast('IN-GAME APPLIED ✓', false);
                }, 2500);
            } else {
                showFloatToast('SYSTEM ERROR', true);
            }
        });

        btnHide.addEventListener('click', function(e) {
            e.stopPropagation();
            if (window.Android && window.Android.onHide) {
                window.Android.onHide();
            }
        });

        btnClose.addEventListener('click', function(e) {
            e.stopPropagation();
            if (window.Android && window.Android.onClose) {
                window.Android.onClose();
            }
        });

        setProtectionState(false);
        setPakState("");

        window.addEventListener('load', function() {
            setTimeout(function() {
                try {
                    if (window.Android && Android.getSelectedPak) {
                        var pak = Android.getSelectedPak();
                        setPakState(pak);
                    }
                } catch (e) {}
            }, 300);

            setTimeout(function() {
                try {
                    if (window.Android && Android.getVpnState) {
                        var v = Android.getVpnState();
                        setProtectionState(v === 'true' || v === true);
                    }
                } catch (e) {}
            }, 500);
        });
    </script>
</body>
</html>
