<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aadhi GFX Floating</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background: transparent !important;
            margin: 0; padding: 10px;
            user-select: none; -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* MAIN WINDOW (OPEN) */
        .floating-window {
            width: 320px;
            background: rgba(10, 14, 23, 0.95); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px 20px 20px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-top: 2px solid rgba(0, 255, 204, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        /* MINI MODE (TRANSPARENT TEXT ONLY) */
        .floating-window.mini {
            width: auto;
            background: transparent;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 5px;
        }

        #mainControls { display: block; }
        .floating-window.mini #mainControls { display: none; }

        #miniControls { display: none; }
        .floating-window.mini #miniControls { display: block; }

        /* 🔥 HIDE HONE PAR SIRF YEH TEXT DIKHEGA (No Box) 🔥 */
        .mini-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #00ffcc;
            /* Text ke piche heavy stroke taaki game background par padha ja sake */
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 10px rgba(0,255,204,0.8);
            white-space: nowrap;
            margin-top: 10px;
            margin-left: 5px;
            animation: pulseGlow 2s infinite;
        }

        /* HEADER */
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; padding-bottom: 15px; }
        .header .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ffcc; box-shadow: 0 0 12px #00ffcc; animation: pulse-dot 2s infinite; }
        .header .status-dot.off { background: #ff3366; box-shadow: 0 0 10px rgba(255,51,102,0.6); animation: none; }
        .header .brand { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .header .brand .title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #fff; }
        .header .brand .title span { color: #00ffcc; }
        .header .brand .sub { font-size: 10px; color: #94a3b8; letter-spacing: 3px; font-weight: 700; margin-top: 4px; }
        .divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,204,0.3), transparent); margin-bottom: 15px; }

        /* PAK STATUS */
        .pak-status { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .pak-status.active { border-color: rgba(0,255,204,0.5); }
        .pak-status .info { display: flex; align-items: center; gap: 10px; }
        .pak-status .info .icon { font-size: 16px; opacity: 0.5; }
        .pak-status.active .info .icon { opacity: 1; }
        .pak-status .info .text { font-size: 12px; font-weight: 700; color: #94a3b8; letter-spacing: 1px; }
        .pak-status.active .info .text { color: #00ffcc; }
        .pak-status .badge { font-size: 10px; font-weight: 800; color: #64748b; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; }
        .pak-status.active .badge { color: #000; background: #00ffcc; }

        /* ACTION BUTTONS */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-apply { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(0,0,0,0.5)); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 12px 5px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-apply .em { font-size: 18px; }
        .btn-apply .txt { font-size: 11px; font-weight: 700; color: #cbd5e1; }
        .btn-apply.disabled { opacity: 0.3; }

        @keyframes pulseGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.6; } }

        /* DNS TOGGLE */
        .dns-card { background: rgba(0,0,0,0.5); border-radius: 16px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .dns-card.active { border-color: rgba(0,119,255,0.5); }
        .dns-info { display: flex; flex-direction: column; gap: 2px; }
        .dns-info .title { font-size: 13px; font-weight: 700; color: #fff; }
        .dns-info .sub { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .dns-card.active .dns-info .sub { color: #0077ff; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); border-radius: 34px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #cbd5e1; border-radius: 50%; transition: 0.4s; }
        input:checked + .slider { background-color: rgba(0,119,255,0.3); border-color: #0077ff; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* BOTTOM CONTROLS */
        .bottom-controls { display: flex; gap: 10px; }
        .btn-bottom { flex: 1; padding: 12px 0; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900; color: #fff; text-align: center; border: none; }
        .btn-hide { background: linear-gradient(90deg, rgba(51,65,85,0.9), rgba(30,41,59,0.9)); border: 1px solid rgba(255,255,255,0.2); }
        .btn-close { background: linear-gradient(90deg, rgba(255,0,85,0.9), rgba(204,0,68,0.9)); border: 1px solid rgba(255,0,85,0.5); }

        /* TOAST */
        .float-toast { position: absolute; top: -45px; left: 50%; transform: translateX(-50%) translateY(10px); background: rgba(0,0,0,0.95); border: 1px solid #00ffcc; border-radius: 12px; padding: 8px 18px; font-size: 11px; font-weight: 700; color: #00ffcc; opacity: 0; transition: 0.3s; z-index: 100; text-transform: uppercase; }
        .float-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="floating-window" id="floatingWindow">

        <!-- MINI MODE TEXT -->
        <div id="miniControls">
            <div class="mini-text">AADHI GFX TOOL</div>
        </div>

        <!-- MAIN MENU -->
        <div id="mainControls">
            <div class="header">
                <span class="status-dot" id="headerDot"></span>
                <div class="brand">
                    <span class="title">AADHI <span>GFX TOOL</span></span>
                    <span class="sub">PREMIUM FLOATING ENGINE</span>
                </div>
            </div>
            
            <div class="divider"></div>

            <div class="pak-status" id="pakStatus">
                <div class="info">
                    <span class="icon">🚀</span>
                    <span class="text" id="pakStatusText">NO PAK SELECTED</span>
                </div>
                <span class="badge" id="pakBadge">NONE</span>
            </div>

            <div class="action-grid">
                <div class="btn-apply disabled" id="btnLobby">
                    <span class="em">🎮</span><span class="txt">LOBBY APPLY</span>
                </div>
                <div class="btn-apply disabled" id="btnInGame">
                    <span class="em">⚔️</span><span class="txt">IN-GAME APPLY</span>
                </div>
            </div>

            <div class="dns-card" id="dnsCard">
                <div class="dns-info">
                    <span class="title">ANTI-BAN DNS</span>
                    <span class="sub" id="dnsSubtitle">Protection Disabled</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="dnsToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="bottom-controls">
                <div class="btn-bottom btn-hide" id="btnHide">HIDE</div>
                <div class="btn-bottom btn-close" id="btnClose">CLOSE</div>
            </div>
        </div>

        <div class="float-toast" id="floatToast">READY</div>
    </div>

    <script>
        var floatingWindow = document.getElementById('floatingWindow');
        
        // Java se command bhej kar touch issue thik karne ki ninja technique
        function expandWindow() {
            floatingWindow.classList.remove('mini');
            if(window.Android && Android.resizeWindow) {
                Android.resizeWindow(350, 480); // Open hone par full size
            }
        }

        document.getElementById('btnHide').addEventListener('click', function(e) {
            e.stopPropagation();
            floatingWindow.classList.add('mini'); 
            if(window.Android && Android.resizeWindow) {
                Android.resizeWindow(160, 50); // Hide hone par WebView ekdum chota ho jayega (Touch Block Fix)
            }
        });

        // Pak state
        window.setPakState = function(pakKey) {
            var btnLobby = document.getElementById('btnLobby'), btnInGame = document.getElementById('btnInGame');
            if (!pakKey || pakKey === "null" || pakKey === "") {
                document.getElementById('pakStatus').classList.remove('active');
                document.getElementById('pakStatusText').textContent = 'NO PAK SELECTED';
                document.getElementById('pakBadge').textContent = 'NONE';
                btnLobby.classList.add('disabled'); btnInGame.classList.add('disabled');
            } else {
                document.getElementById('pakStatus').classList.add('active');
                document.getElementById('pakStatusText').textContent = pakKey.toUpperCase().replace('_URL', '') + ' READY';
                document.getElementById('pakBadge').textContent = 'ACTIVE';
                btnLobby.classList.remove('disabled'); btnInGame.classList.remove('disabled');
            }
        };

        // DNS state
        window.setProtectionState = function(active) {
            document.getElementById('dnsToggle').checked = active; 
            if (active) {
                document.getElementById('headerDot').className = 'status-dot';
                document.getElementById('dnsCard').classList.add('active');
                document.getElementById('dnsSubtitle').textContent = 'SECURE DNS RUNNING';
            } else {
                document.getElementById('headerDot').className = 'status-dot off';
                document.getElementById('dnsCard').classList.remove('active');
                document.getElementById('dnsSubtitle').textContent = 'PROTECTION DISABLED';
            }
        };

        document.getElementById('dnsToggle').addEventListener('change', function(e) {
            if (window.Android && window.Android.onProtectionToggle) window.Android.onProtectionToggle(e.target.checked);
            setProtectionState(e.target.checked);
        });

        document.getElementById('btnLobby').addEventListener('click', function(e) {
            if (!this.classList.contains('disabled') && window.Android && Android.reapplyPak) Android.reapplyPak("lobby");
        });

        document.getElementById('btnInGame').addEventListener('click', function(e) {
            if (!this.classList.contains('disabled') && window.Android && Android.reapplyPak) Android.reapplyPak("ingame");
        });

        document.getElementById('btnClose').addEventListener('click', function(e) {
            if (window.Android && window.Android.onClose) window.Android.onClose();
        });

        window.addEventListener('load', function() {
            setTimeout(function() { if (window.Android && Android.getSelectedPak) setPakState(Android.getSelectedPak()); }, 300);
            setTimeout(function() { if (window.Android && Android.getVpnState) setProtectionState(Android.getVpnState() === 'true'); }, 500);
        });
    </script>
</body>
</html>
