<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhi VIP - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background-color: #050810; background-image: radial-gradient(circle at 15% 50%, rgba(0,255,204,0.08) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(0,119,255,0.08) 0%, transparent 50%); color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .login-box { background: rgba(15,23,42,0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(0,255,204,0.3); border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,255,204,0.02); animation: floatUp 0.8s ease-out; }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .shield-icon { width: 60px; height: 60px; background: linear-gradient(135deg, rgba(0,255,204,0.1), rgba(0,119,255,0.1)); border: 1px solid rgba(0,255,204,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 26px; color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
        .logo h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; color: #fff; letter-spacing: 2px; margin-bottom: 4px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo h1 span { color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.5); }
        .logo p { font-size: 11px; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 35px; font-weight: 500; }
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; transition: 0.3s; }
        .input-group input { width: 100%; padding: 18px 20px 18px 50px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: #00ffcc; font-size: 15px; outline: none; transition: 0.3s; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .input-group input::placeholder { color: #475569; font-family: 'Poppins', sans-serif; letter-spacing: 0; }
        .input-group input:focus { border-color: #00ffcc; background: rgba(0,255,204,0.03); box-shadow: 0 0 20px rgba(0,255,204,0.15); }
        .input-group input:focus + i, .input-group input:not(:placeholder-shown) + i { color: #00ffcc; }
        .error-text { color: #ff3366; font-size: 12px; margin-top: -15px; margin-bottom: 15px; height: 18px; font-weight: 500; display: block; opacity: 0; transition: 0.3s; }
        .btn-login { background: linear-gradient(90deg, #00ffcc, #0077ff); border: none; color: #000; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; padding: 18px; border-radius: 14px; width: 100%; box-shadow: 0 8px 25px rgba(0,255,204,0.3); transition: 0.3s; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-login:active { transform: scale(0.96); }
        .btn-login:disabled { background: #1e293b; color: #64748b; box-shadow: none; cursor: not-allowed; }
        .spinner { animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .divider { display: flex; align-items: center; margin: 30px 0 20px; color: #475569; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
        .divider span { padding: 0 15px; }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; text-decoration: none; font-size: 12px; font-weight: 600; color: #fff; transition: 0.3s; border: 1px solid transparent; }
        .btn-tg { background: rgba(0,136,204,0.1); border-color: rgba(0,136,204,0.2); } .btn-tg i { color: #0088cc; font-size: 16px; }
        .btn-tg:active { background: rgba(0,136,204,0.2); }
        .btn-yt { background: rgba(255,0,0,0.08); border-color: rgba(255,0,0,0.2); } .btn-yt i { color: #ff0000; font-size: 16px; }
        .btn-yt:active { background: rgba(255,0,0,0.15); }
        .btn-wa { background: rgba(37,211,102,0.08); border-color: rgba(37,211,102,0.2); grid-column: span 2; margin-top: 5px; } .btn-wa i { color: #25d366; font-size: 16px; }
        .btn-wa:active { background: rgba(37,211,102,0.15); }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <div class="shield-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="logo">
            <h1>AADHI <span>VIP</span></h1>
            <p>Secure Authentication</p>
        </div>
        <div class="input-group">
            <input type="text" id="vipKey" placeholder="Paste VIP Key Here" autocomplete="off" spellcheck="false">
            <i class="fa-solid fa-key"></i>
        </div>
        <span class="error-text" id="errorText">Invalid Key!</span>
        <button class="btn-login" id="loginBtn" onclick="verifyKey()">
            <span id="btnText">UNLOCK ENGINE</span>
            <i class="fa-solid fa-circle-notch spinner" id="spinnerIcon"></i>
        </button>
        <div class="divider"><span>Get Key / Community</span></div>
        <div class="social-grid">
            <a href="https://t.me/aadhi_aadil0" class="social-btn btn-tg"><i class="fa-brands fa-telegram"></i> Telegram</a>
            <a href="https://youtube.com/@your_channel" class="social-btn btn-yt"><i class="fa-brands fa-youtube"></i> YouTube</a>
            <a href="https://wa.me/your_number_here" class="social-btn btn-wa"><i class="fa-brands fa-whatsapp"></i> Buy via WhatsApp</a>
        </div>
    </div>

    <script>
        // Jab page load ho, agar saved key ho to auto-fill (auto-login Java khud handle karega)
        window.addEventListener('load', () => {
            if (typeof Android !== 'undefined') {
                try {
                    const saved = Android.getSavedKey();
                    if (saved && saved.length > 0) {
                        document.getElementById('vipKey').value = saved;
                    }
                } catch (e) {}
            }
        });

        function verifyKey() {
            let inputKey = document.getElementById("vipKey").value.trim();
            let loginBox = document.getElementById("loginBox");
            let errorText = document.getElementById("errorText");
            let loginBtn = document.getElementById("loginBtn");
            let btnText = document.getElementById("btnText");
            let spinnerIcon = document.getElementById("spinnerIcon");

            if (inputKey === "") {
                showError("Key cannot be empty!");
                loginBox.classList.add("shake");
                setTimeout(() => loginBox.classList.remove("shake"), 400);
                return;
            }

            // Loading UI
            btnText.innerText = "AUTHENTICATING...";
            spinnerIcon.style.display = "inline-block";
            loginBtn.disabled = true;
            errorText.style.opacity = "0";

            if (typeof Android !== 'undefined') {
                // Save key (for auto-login)
                try { Android.saveKey(inputKey); } catch (e) {}
                // Ask Java to verify against Firebase & open dashboard
                try { Android.goToDashboard(inputKey); } catch (e) {}
            } else {
                // Browser preview fallback
                setTimeout(() => {
                    btnText.innerText = "ACCESS GRANTED";
                    spinnerIcon.className = "fa-solid fa-check";
                    setTimeout(() => { window.location.href = "vip.html"; }, 600);
                }, 1200);
            }

            // Safety: agar Java respond na kare to 8 sec baad reset
            setTimeout(() => {
                if (loginBtn.disabled) {
                    btnText.innerText = "UNLOCK ENGINE";
                    spinnerIcon.style.display = "none";
                    spinnerIcon.className = "fa-solid fa-circle-notch spinner";
                    loginBtn.disabled = false;
                }
            }, 8000);
        }

        function showError(msg) {
            let errorText = document.getElementById("errorText");
            errorText.innerText = msg;
            errorText.style.opacity = "1";
        }

        // Java se error aane par HTML button reset karne ke liye (optional)
        function onLoginError(msg) {
            let btnText = document.getElementById("btnText");
            let spinnerIcon = document.getElementById("spinnerIcon");
            let loginBtn = document.getElementById("loginBtn");
            btnText.innerText = "UNLOCK ENGINE";
            spinnerIcon.style.display = "none";
            spinnerIcon.className = "fa-solid fa-circle-notch spinner";
            loginBtn.disabled = false;
            showError(msg || "Invalid Key!");
        }
    </script>
</body>
</html>
