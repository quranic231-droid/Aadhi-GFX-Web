<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aadhi Floating Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Transparent Background for Android Overlay */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: transparent; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        /* Floating Text Bar (Replaced Logo) */
        #float-bar {
            position: absolute;
            top: 30px;
            left: 20px;
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            padding: 8px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #00ffcc;
            letter-spacing: 1px;
            white-space: nowrap; /* Forces text in a single line */
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }
        #float-bar:active { transform: scale(0.95); }
        /* Blinking dot for active status */
        #float-bar::before {
            content: '';
            width: 8px; height: 8px;
            background-color: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0055;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* The Main Mod Menu */
        #mod-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 260px;
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,255,204,0.1);
            display: none; 
            opacity: 0;
            z-index: 1001;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        #mod-menu.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Menu Header */
        .menu-header {
            background: linear-gradient(90deg, rgba(0, 255, 204, 0.2), transparent);
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .menu-header h2 { font-family: 'Orbitron', sans-serif; font-size: 15px; color: #fff; letter-spacing: 1px;}
        .menu-header h2 span { color: #00ffcc; }

        /* Menu Body */
        .menu-body { padding: 15px; }

        /* DNS Toggle Row */
        .feature-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .feature-row.active-row { border-color: rgba(0,255,204,0.4); background: rgba(0,255,204,0.05); }
        .feature-name { font-size: 13px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 8px;}

        /* Switch UI */
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .4s; border-radius: 34px; border: 1px solid #334155; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #94a3b8; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ffcc; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.5); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        /* Action Buttons (Hide & Close) */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 10px; border-radius: 8px; border: none; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase; color: #fff;}
        .btn:active { transform: scale(0.95); }
        
        .btn-hide { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-hide:hover { background: rgba(255,255,255,0.15); }
        
        .btn-stop { background: linear-gradient(90deg, #ff0055, #cc0044); box-shadow: 0 5px 15px rgba(255,0,85,0.3); }
    </style>
</head>
<body>

    <!-- Single Line Draggable Text Bar -->
    <div id="float-bar">AADHI PAID GFX TOOL</div>

    <!-- The Mod Menu Window -->
    <div id="mod-menu">
        <div class="menu-header">
            <h2>AADHI <span>CONTROL</span></h2>
        </div>
        
        <div class="menu-body">
            
            <!-- DNS Control Only -->
            <div class="feature-row" id="row-dns">
                <span class="feature-name"><i class="fa-solid fa-server" style="color:#00ffcc;"></i> ANTI-BAN DNS</span>
                <label class="switch">
                    <input type="checkbox" onchange="toggleDNS(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Hide and Stop Buttons -->
            <div class="btn-grid">
                <button class="btn btn-hide" onclick="hideMenu()"><i class="fa-solid fa-eye-slash"></i> HIDE</button>
                <button class="btn btn-stop" onclick="stopApp()"><i class="fa-solid fa-power-off"></i> STOP</button>
            </div>
            
        </div>
    </div>

    <script>
        // --- Elements ---
        const floatBar = document.getElementById('float-bar');
        const modMenu = document.getElementById('mod-menu');

        // --- Window Management Logic ---
        
        // Open Menu
        floatBar.addEventListener('click', () => {
            modMenu.classList.add('active');
            floatBar.style.display = 'none'; // Text bar chup jayega
        });

        // Hide Menu (Wapas Text Bar ban jayega)
        function hideMenu() {
            modMenu.classList.remove('active');
            floatBar.style.display = 'flex'; // Text bar wapas aa jayega
        }

        // Stop / Close App completely
        function stopApp() {
            if(confirm("Are you sure you want to STOP and CLOSE the tool?")) {
                // Java Backend ko command bhejo ki service band kare
                if(typeof Android !== 'undefined') {
                    Android.stopFloatingService(); 
                } else {
                    document.body.style.display = 'none'; // Browser testing ke liye gayab
                    alert("App Stopped & Floating Service Closed!");
                }
            }
        }

        // --- DNS Toggle Logic ---
        function toggleDNS(checkbox) {
            let row = document.getElementById('row-dns');
            if(checkbox.checked) {
                row.classList.add('active-row');
                if(typeof Android !== 'undefined') Android.showToast("DNS Connected Successfully!");
            } else {
                row.classList.remove('active-row');
                if(typeof Android !== 'undefined') Android.showToast("DNS Disconnected!");
            }
        }

        // --- Drag Logic for Text Bar (Touch & Mouse) ---
        let isDragging = false;
        let startX, startY, initialX, initialY;

        floatBar.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('touchend', dragEnd);

        floatBar.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            initialX = floatBar.offsetLeft;
            initialY = floatBar.offsetTop;

            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            isDragging = true;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            
            let currentX, currentY;
            if (e.type === 'touchmove') {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX;
                currentY = e.clientY;
            }

            let diffX = currentX - startX;
            let diffY = currentY - startY;

            let newX = initialX + diffX;
            let newY = initialY + diffY;

            let maxW = window.innerWidth - floatBar.offsetWidth;
            let maxH = window.innerHeight - floatBar.offsetHeight;

            if(newX < 0) newX = 0;
            if(newY < 0) newY = 0;
            if(newX > maxW) newX = maxW;
            if(newY > maxH) newY = maxH;

            floatBar.style.left = newX + "px";
            floatBar.style.top = newY + "px";
        }

        function dragEnd(e) {
            isDragging = false;
        }
    </script>

</body>
</html>
