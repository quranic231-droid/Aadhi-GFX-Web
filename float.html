<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aadhi Floating</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
    html, body { background: transparent; width:100%; height:100%; overflow:hidden; }

    /* ─── BAR MODE ─── */
    #float-bar {
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        background: #0a0f19;
        border: 1px solid #00ffcc;
        border-radius: 10px;
        padding: 0 14px;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: #00ffcc;
        letter-spacing: 1px;
        white-space: nowrap;
        box-shadow: 0 0 10px rgba(0,255,204,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    #float-bar::before {
        content: '';
        width: 7px; height: 7px;
        background: #ff0055;
        border-radius: 50%;
        box-shadow: 0 0 6px #ff0055;
        animation: blink 1.5s infinite;
        flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ─── MENU MODE ─── */
    #mod-menu {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0a0f19;
        border: 1px solid #00ffcc;
        border-radius: 14px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0,255,204,0.3);
    }
    #mod-menu.visible { display: flex; }

    .menu-header {
        background: linear-gradient(90deg, rgba(0,255,204,0.25), transparent);
        padding: 16px 14px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        cursor: grab;
    }
    .menu-header h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 15px;
        color: #fff;
        letter-spacing: 1px;
    }
    .menu-header h2 span { color: #00ffcc; }
    .menu-header .drag-hint {
        font-size: 9px;
        color: #64748b;
        margin-top: 3px;
        letter-spacing: 1px;
    }

    .menu-body { padding: 16px; flex: 1; }

    .feature-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.03);
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.06);
        transition: 0.2s;
    }
    .feature-row.active-row {
        border-color: rgba(0,255,204,0.5);
        background: rgba(0,255,204,0.06);
    }
    .feature-name {
        font-size: 12px;
        font-weight: 600;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
        position: absolute; cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1e293b;
        transition: .3s; border-radius: 34px;
        border: 1px solid #334155;
    }
    .slider:before {
        position: absolute; content: "";
        height: 14px; width: 14px;
        left: 3px; bottom: 3px;
        background: #94a3b8;
        transition: .3s; border-radius: 50%;
    }
    input:checked + .slider {
        background: #00ffcc;
        border-color: #00ffcc;
    }
    input:checked + .slider:before {
        transform: translateX(20px);
        background: #000;
    }

    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: auto;
    }
    .btn {
        padding: 14px;
        border-radius: 10px;
        border: none;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        color: #fff;
    }
    .btn-hide {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-stop {
        background: linear-gradient(90deg, #ff0055, #cc0044);
    }
</style>
</head>
<body>

    <div id="float-bar">AADHI PAID GFX TOOL</div>

    <div id="mod-menu">
        <div class="menu-header">
            <h2>AADHI <span>CONTROL</span></h2>
            <div class="drag-hint">drag this header to move</div>
        </div>
        <div class="menu-body" style="display:flex;flex-direction:column;">
            <div class="feature-row" id="row-dns">
                <span class="feature-name">
                    <i class="fa-solid fa-server" style="color:#00ffcc;"></i> ANTI-BAN VPN
                </span>
                <label class="switch">
                    <input type="checkbox" onchange="toggleDNS(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="btn-grid">
                <button class="btn btn-hide" onclick="doHide()">
                    <i class="fa-solid fa-eye-slash"></i> HIDE
                </button>
                <button class="btn btn-stop" onclick="doStop()">
                    <i class="fa-solid fa-power-off"></i> STOP
                </button>
            </div>
        </div>
    </div>

    <script>
        const floatBar = document.getElementById('float-bar');
        const modMenu  = document.getElementById('mod-menu');

        // Called by Java when bar is tapped
        window.showMenuContent = function() {
            floatBar.style.display = 'none';
            modMenu.classList.add('visible');
        };

        // Called by Java when menu is closed
        window.hideMenuContent = function() {
            modMenu.classList.remove('visible');
            floatBar.style.display = 'flex';
        };

        function doHide() {
            if (typeof Android !== 'undefined') Android.hideMenu();
        }

        function doStop() {
            if (typeof Android !== 'undefined') Android.stopFloatingService();
        }

        function toggleDNS(checkbox) {
            const row = document.getElementById('row-dns');
            if (checkbox.checked) {
                row.classList.add('active-row');
                if (typeof Android !== 'undefined') Android.toggleVpn(true);
            } else {
                row.classList.remove('active-row');
                if (typeof Android !== 'undefined') Android.toggleVpn(false);
            }
        }
    </script>
</body>
</html>
